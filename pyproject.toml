[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fofamap"
version = "2.0.2"
description = "FOFA API, MCP 2.0 and vendor-neutral workflow agent"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.116,<1",
  "httpx[http2]>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mcp>=2,<3",
  "mmh3>=5,<6",
  "opentelemetry-api>=1.28,<2",
  "pydantic>=2.11,<3",
  "PyJWT[crypto]>=2.10,<3",
  "PyYAML>=6,<7",
  "questionary>=2.1,<3",
  "rich>=14,<16",
  "rich-click>=1.8,<2",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "xlsxwriter>=3.2,<4",
  "keyring>=25,<26",
  "tzdata>=2025.2",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
scan = []
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[project.scripts]
fofamap = "fofamap:main"
fofamap-api = "service.api:main"
fofamap-mcp = "mcp_server:run_server"
fofamap-scheduler = "service.scheduler:main"

[tool.hatch.build.targets.wheel]
only-include = ["config", "core", "providers", "service", "utils", "fofamap.py", "mcp_server.py", "agent-kit"]
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: opt-in tests that call real FOFA/model APIs and may consume quota"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]
