name: Install and MCP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: '1'
      FOFAMAP_LANGUAGE: en
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Language en -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe scripts/check_installation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install.sh --language en --python "$(command -v python)"
          .venv/bin/python scripts/check_installation.py
      - name: Verify packaged Python source
        shell: bash
        run: python -m compileall -q config core providers service utils fofamap.py mcp_server.py
